name: Release macOS app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Package universal app
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/package.sh "${RELEASE_TAG#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/*.zip dist/*.sha256
          --verify-tag
          --title "SlackHarder $RELEASE_TAG"
          --notes-file .github/release-notes.md
